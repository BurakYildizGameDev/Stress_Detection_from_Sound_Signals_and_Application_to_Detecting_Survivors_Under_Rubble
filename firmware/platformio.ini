; ESP32-S3 + INMP441 prototipi. Donanımda test edilmedi.
;
; Derlemeden önce model başlık dosyalarını üretin (repo kökünden):
;   python scripts/export_c_model.py models/human_detector_esp.pkl --name human_detector
;   python scripts/export_c_model.py models/emergency_classifier_esp.pkl --name emergency_classifier
; Sonra:
;   cd firmware && pio run            (derle)
;   pio run -t upload && pio device monitor

[platformio]
default_envs = esp32-s3-devkitc-1

; Gerçek kart: INMP441 mikrofon
[env:esp32-s3-devkitc-1]
platform = espressif32@^6
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; İki model ~650 KB; varsayılan bölüm tablosu yerine 3 MB'lık uygulama bölümü
board_build.partitions = huge_app.csv

build_flags =
    -O2
    -Wall
    ; USB CDC üzerinden seri port (DevKitC'nin "USB" girişi)
    -DARDUINO_USB_CDC_ON_BOOT=1

; Wokwi simülasyonu: mikrofon yerine include/sim_scenario.h'deki pencereler
; (Wokwi ESP32-S3'te I2S ve mikrofon simüle etmiyor). Bkz. wokwi.toml, diagram.json
;   pio run -e wokwi
[env:wokwi]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DRUBBLE_SIM_SCENARIO=1
